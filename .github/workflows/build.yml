name: Build & Package Decky Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: pnpm install

      - name: Build Frontend
        run: pnpm run build

      - name: Package Plugin ZIP (VPN-WoL.zip)
        run: |
          mkdir -p out/VPN-WoL/dist
          cp plugin.json package.json main.py LICENSE README.md out/VPN-WoL/
          cp -r dist/* out/VPN-WoL/dist/
          cd out
          zip -r ../VPN-WoL.zip VPN-WoL/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPN-WoL
          path: VPN-WoL.zip

      - name: Create GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VPN-WoL.zip
          generate_release_notes: true
